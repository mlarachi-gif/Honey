<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Happy New Year ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#0b0b2e,#000);
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  color:white;
}

/* Start heart - ULTRA OPTIMIZED */
#start{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:120px;
  cursor:pointer;
  animation:pulse 2s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(255,80,90,.6));
  transition: transform 0.2s ease;
  will-change: transform;
}
#start:hover{
  transform:translate(-50%,-50%) scale(1.1);
}
@keyframes pulse{
  0%, 100%{transform:translate(-50%,-50%) scale(1);}
  50%{transform:translate(-50%,-50%) scale(1.15);}
}

/* Click hint */
#startHint{
  position:absolute;
  top:58%;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  font-weight:500;
  opacity:.85;
  animation:hintFloat 2s ease-in-out infinite;
  pointer-events:none;
  background:linear-gradient(135deg, rgba(255,77,77,.12), rgba(196,69,105,.12));
  padding:12px 28px;
  border-radius:50px;
  border:2px solid rgba(255,107,157,.25);
  box-shadow:0 0 20px rgba(255,107,157,.3);
  will-change: transform;
}
@keyframes hintFloat{
  0%, 100%{transform:translate(-50%,0); opacity:.7;}
  50%{transform:translate(-50%,6px); opacity:.95;}
}

/* Tree - SLOWER ANIMATION */
#tree{
  position:absolute;
  bottom:-400px;
  left:2%;
  display:none;
  animation:riseTree 5s cubic-bezier(.34,.8,.34,1) forwards, sway 4s ease-in-out infinite 5.5s;
  will-change: bottom;
  filter:drop-shadow(0 10px 30px rgba(255,80,90,.3));
}
@keyframes riseTree{ 
  to{
    bottom:0;
    filter:drop-shadow(0 10px 40px rgba(255,80,90,.4));
  } 
}
@keyframes sway{
  0%, 100%{transform:rotate(0deg);}
  25%{transform:rotate(-1.5deg);}
  75%{transform:rotate(1.5deg);}
}

/* Trunk - SLOWER */
#trunk{
  width:32px;
  height:0;
  background:linear-gradient(to bottom, #8B4513, #654321);
  margin:auto;
  border-radius:16px;
  box-shadow:inset 0 0 12px rgba(0,0,0,.3);
  animation:growTrunk 4s cubic-bezier(.34,.8,.34,1) forwards;
  will-change: height;
}
@keyframes growTrunk{ 
  to{height:320px;} 
}

/* Heart area */
#heartTree{
  width:550px;
  height:480px;
  position:relative;
  margin:0 auto 12px auto;
  animation:heartGlow 3s ease-in-out infinite 8s;
}

@keyframes heartGlow{
  0%, 100%{filter:drop-shadow(0 0 15px rgba(255,70,90,.3));}
  50%{filter:drop-shadow(0 0 30px rgba(255,70,90,.6));}
}

/* Heart leaves - SLOWER BLOOM */
.leaf{
  position:absolute;
  opacity:0;
  transform:scale(0.3);
  animation:bloom 3s cubic-bezier(.34,1.2,.64,1) forwards;
  will-change: opacity, transform;
  filter:drop-shadow(0 0 12px rgba(255,70,90,.5));
}
@keyframes bloom{
  0%{opacity:0; transform:translateY(30px) scale(0.2) rotate(-20deg);}
  40%{opacity:0.7; transform:translateY(5px) scale(0.9) rotate(5deg);}
  60%{opacity:1; transform:translateY(-5px) scale(1.1) rotate(-2deg);}
  100%{opacity:1; transform:translateY(0) scale(1) rotate(0deg);}
}

/* Text */
#text{
  position:absolute;
  top:16%;
  right:6%;
  width:42%;
  font-size:22px;
  line-height:1.8;
  opacity:0;
  transition:opacity 1.5s ease;
}
#text.visible{
  opacity:1;
}
.name{
  font-family:'Great Vibes',cursive;
  font-size:56px;
  color:#ff4d4d;
  text-shadow:0 0 15px rgba(255,80,80,.8);
}

/* FALLING HEART THAT BECOMES BUTTON */
.falling-heart{
  position:fixed;
  font-size:50px;
  z-index:150;
  animation:heartFall 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  filter:drop-shadow(0 0 15px rgba(255,70,90,.8));
  pointer-events:none;
}

@keyframes heartFall{
  0%{
    opacity:1;
    transform:translateY(0) rotate(0deg) scale(1);
  }
  30%{
    transform:translateY(15vh) rotate(180deg) scale(0.9);
  }
  60%{
    transform:translateY(35vh) rotate(360deg) scale(0.7);
  }
  80%{
    transform:translateY(50vh) rotate(450deg) scale(0.4);
  }
  100%{
    opacity:0;
    transform:translateY(56vh) rotate(540deg) scale(0);
  }
}

/* Button - SUPER SMOOTH & ROMANTIC */
.romantic-btn{
  position:fixed;
  right:6%;
  padding:18px 42px;
  border-radius:50px;
  border:none;
  font-size:18px;
  font-weight:500;
  cursor:pointer;
  opacity:0;
  transform:scale(0);
  pointer-events:none;
  transition:all 0.3s ease;
  box-shadow:0 5px 30px rgba(255,107,157,.5);
  background:linear-gradient(135deg, #ff4d6d, #c44569);
  color:white;
  will-change: transform, opacity;
  text-shadow:0 2px 4px rgba(0,0,0,.3);
}

.romantic-btn::before{
  content:'';
  position:absolute;
  inset:-3px;
  border-radius:50px;
  padding:3px;
  background:linear-gradient(135deg, #ff6b9d, #ff4d6d, #c44569);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:0.6;
  animation:borderGlow 2s ease infinite;
}

@keyframes borderGlow{
  0%, 100%{opacity:0.5;}
  50%{opacity:0.9;}
}

#loveBtn{
  top:72%;
}

#finalBtn{
  top:85%;
  background:linear-gradient(135deg, #ffd700, #ffb900);
  box-shadow:0 5px 30px rgba(255,215,0,.5);
}

#finalBtn::before{
  background:linear-gradient(135deg, #ffa500, #ffd700, #ffb900);
}

.romantic-btn.show{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
  animation:btnPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes btnPop{
  0%{transform:scale(0);}
  70%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

.romantic-btn:hover{
  transform:scale(1.08) translateY(-3px);
  box-shadow:0 8px 40px rgba(255,107,157,.7);
}

#finalBtn:hover{
  box-shadow:0 8px 40px rgba(255,215,0,.7);
}

/* Final Scene - OPTIMIZED */
#finalScene{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
  opacity:0;
  transition:opacity 2s ease;
}
#finalScene.show{
  display:flex;
  opacity:1;
  background:radial-gradient(ellipse at center, rgba(10,10,40,0.98), rgba(0,0,0,0.99));
}

#finalContent{
  text-align:center;
  max-width:1000px;
  padding:60px 40px;
  position:relative;
  z-index:2;
}

#finalContent h1{
  font-family:'Great Vibes',cursive;
  font-size:78px;
  color:#ff4d4d;
  margin-bottom:60px;
  text-shadow:0 0 30px rgba(255,80,80,.9);
  animation:titleGlow 3s ease-in-out infinite;
  opacity:0;
  transform:translateY(-30px);
}
#finalScene.show #finalContent h1{
  animation:titleGlow 3s ease-in-out infinite, titleDrop 1.2s ease-out forwards;
}

@keyframes titleDrop{
  to{opacity:1; transform:translateY(0);}
}

@keyframes titleGlow{
  0%, 100%{text-shadow:0 0 30px rgba(255,80,80,.8);}
  50%{text-shadow:0 0 45px rgba(255,80,80,1);}
}

#finalContent .message-line{
  font-size:32px;
  font-weight:400;
  line-height:2.4;
  margin:20px 0;
  opacity:0;
  text-shadow:0 2px 10px rgba(255,255,255,.15);
}

.message-line.visible{
  animation:dropFromSky 1.5s ease-out forwards;
}

@keyframes dropFromSky{
  0%{opacity:0; transform:translateY(-50px);}
  100%{opacity:1; transform:translateY(0);}
}

/* Optimized plane squadron */
.plane-squadron{
  position:fixed;
  font-size:45px;
  z-index:999;
  filter:drop-shadow(0 0 15px rgba(255,255,255,.6));
  will-change: left, top;
}

.plane-1{animation:planeFlightLeader 5s linear infinite; animation-delay:0s;}
.plane-2{animation:planeFlightLeader 5s linear infinite; animation-delay:7s;}
.plane-3{animation:planeFlightLeader 5s linear infinite; animation-delay:14s;}
.plane-4{animation:planeFlightLeader 5s linear infinite; animation-delay:21s;}
.plane-5{animation:planeFlightLeader 5s linear infinite; animation-delay:28s;}
.plane-6{animation:planeFlightLeader 5s linear infinite; animation-delay:35s;}
.plane-7{animation:planeFlightLeader 5s linear infinite; animation-delay:42s;}

@keyframes planeFlightLeader{
  0%{left:-100px; top:-50px; opacity:0;}
  5%{opacity:1;}
  95%{opacity:1;}
  100%{left:110%; top:25%; opacity:0;}
}

/* Background plane */
#plane{
  position:fixed;
  font-size:55px;
  z-index:1;
  animation:flyAcrossEnhanced 22s linear infinite;
  filter:drop-shadow(0 0 15px rgba(255,255,255,.3));
  opacity:0.4;
  will-change: left;
}

@keyframes flyAcrossEnhanced{
  0%{left:-100px; opacity:0;}
  5%{opacity:0.4;}
  95%{opacity:0.4;}
  100%{left:110%; opacity:0;}
}

/* Papers falling - REDUCED */
.paper{
  position:fixed;
  font-size:24px;
  pointer-events:none;
  z-index:1;
  animation:paperFallSlow 10s linear forwards;
  will-change: transform;
}
@keyframes paperFallSlow{
  0%{transform:translateY(0) rotate(0deg); opacity:0.8;}
  100%{transform:translateY(110vh) rotate(540deg); opacity:0;}
}

/* Flowers - CONTINUOUS RAIN */
.flower{
  position:fixed;
  top:-10vh;
  font-size:22px;
  pointer-events:none;
  animation:fall 8s linear forwards;
  will-change: transform;
  filter:drop-shadow(0 0 8px rgba(255,182,193,.5));
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg); opacity:0;}
}

/* Hearts rain in final scene */
.heart-rain{
  position:fixed;
  top:-10vh;
  font-size:24px;
  pointer-events:none;
  animation:heartRainFall 9s linear forwards;
  will-change: transform;
  filter:drop-shadow(0 0 10px rgba(255,70,90,.6));
}
@keyframes heartRainFall{
  0%{transform:translateY(0) rotate(0deg); opacity:1;}
  100%{transform:translateY(110vh) rotate(720deg); opacity:0;}
}

/* Mobile optimization */
@media (max-width:768px){
  #start{font-size:90px;}
  #startHint{font-size:16px; padding:10px 20px;}
  #heartTree{width:350px; height:310px;}
  #trunk{width:24px;}
  @keyframes growTrunk{to{height:220px;}}
  #text{width:90%; right:5%; font-size:18px;}
  .romantic-btn{right:5%; font-size:16px; padding:14px 32px;}
  #finalContent{padding:20px;}
  #finalContent h1{font-size:42px;}
  #finalContent .message-line{font-size:20px;}
  #plane{font-size:45px;}
  .plane-squadron{font-size:38px;}
}
</style>
</head>

<body>

<div id="start">❤️</div>
<div id="startHint">Click the heart ❤️</div>

<div id="tree">
  <div id="heartTree"></div>
  <div id="trunk"></div>
</div>

<div id="text"></div>
<button id="loveBtn" class="romantic-btn">Mon cœur bat pour toi ❤️</button>
<button id="finalBtn" class="romantic-btn">Notre histoire, nos univers ✨</button>

<div id="finalScene">
  <div id="plane">✈️</div>
  <div id="finalContent">
    <h1>Happy New Year ✨</h1>
    <div class="message-line">As the year turns ✨</div>
    <div class="message-line">between my code 💻 and your wings ✈️</div>
    <div class="message-line">nos rêves yahdro m3a ba3d ❤️</div>
    <div class="message-line">and take off into a new beginning 🚀</div>
    <div class="message-line" style="margin-top:50px; font-size:38px; color:#ffd700;">Happy New Year</div>
    <div class="message-line" style="font-size:36px; color:#ff4d4d;">to us, Maroua ❤️</div>
    <div class="message-line" style="font-size:34px; color:#ffb3d9;">and dreams that never land ✨</div>
  </div>
  <div class="plane-squadron plane-1" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-2" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-3" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-4" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-5" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-6" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-7" style="left:-100px; top:-50px;">✈️</div>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/25/audio_946bdbb4c3.mp3">
</audio>

<script>
const start=document.getElementById("start");
const hint=document.getElementById("startHint");
const tree=document.getElementById("tree");
const heartTree=document.getElementById("heartTree");
const textBox=document.getElementById("text");
const loveBtn=document.getElementById("loveBtn");
const finalBtn=document.getElementById("finalBtn");
const finalScene=document.getElementById("finalScene");
const music=document.getElementById("music");

let typingStarted=false;
let flowerInterval;
let paperInterval;

/* HEART SHAPE - REDUCED COMPLEXITY */
function buildHeartPoints(){
  const w=heartTree.clientWidth;
  const h=heartTree.clientHeight;
  const cx=w*0.5;
  const cy=h*0.55;
  const scale=Math.min(w,h)*0.032;

  const outline=[];
  // Reduced from 200 to 120 for better performance
  for(let i=0;i<120;i++){
    const t=(i/120)*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    outline.push([cx+x*scale,cy-y*scale]);
  }
  
  const fill=[];
  // Reduced from 380 to 250 for better performance
  for(let i=0;i<250;i++){
    const b=outline[Math.random()*outline.length|0];
    const pull=Math.pow(Math.random(),1.6);
    fill.push([
      b[0]+(cx-b[0])*pull+(Math.random()-0.5)*8,
      b[1]+(cy-b[1])*pull+(Math.random()-0.5)*8
    ]);
  }
  return fill.concat(outline).sort((a,b)=>b[1]-a[1]);
}

function spawnHeart(points){
  heartTree.innerHTML="";
  const base=3, step=0.025; // Slower animation
  points.forEach((p,i)=>{
    const l=document.createElement("div");
    l.className="leaf";
    l.innerHTML="❤️";
    l.style.left=p[0]+"px";
    l.style.top=p[1]+"px";
    l.style.fontSize=(14+Math.random()*10)+"px";
    l.style.animationDelay=(base+i*step)+"s";
    heartTree.appendChild(l);
  });
}

/* MESSAGE */
const message=`
Happy New Year ✨<br><br>
Une nouvelle année commence,<br>
and from our roots, love keeps growing,<br>
plus fort, plus haut, plus nous ❤️<br><br>

<span class="name">Maroua ❤️</span><br><br>

hamlghkam a dunithiw<br>
rabi ikhlina lba3dana ❤️<br>
kol 3am w hna kifkif ❤️<br><br>

Je t'aime today,<br>
je t'aime tomorrow,<br>
and for every year our love keeps rising ✨
`;

/* HEART DROPS FROM TREE AND BECOMES BUTTON */
function createHeartDrop(targetBtn) {
  const heart = document.createElement("div");
  heart.className = "falling-heart";
  heart.innerHTML = "❤️";
  
  // Start from tree top area
  heart.style.left = "12%";
  heart.style.top = "15%";
  
  document.body.appendChild(heart);
  
  // Remove heart and show button after animation
  setTimeout(() => {
    heart.remove();
    targetBtn.classList.add("show");
  }, 2500);
}

start.onclick=()=>{
  start.style.display="none";
  hint.style.display="none";
  tree.style.display="block";
  music.play();
  spawnHeart(buildHeartPoints());
  startFlowerRain();
  
  // Small heart drops from tree and becomes first button
  setTimeout(()=>createHeartDrop(loveBtn), 8500);
};

loveBtn.onclick=()=>{
  if(typingStarted) return;
  typingStarted=true;

  loveBtn.style.display="none";
  textBox.classList.add("visible");

  let i=0;
  const t=setInterval(()=>{
    textBox.innerHTML=message.slice(0,i++);
    if(i>message.length){
      clearInterval(t);
      // Another small heart drops and becomes second button
      setTimeout(()=>createHeartDrop(finalBtn), 1500);
    }
  },50); // Faster typing
};

finalBtn.onclick=()=>{
  finalBtn.style.display="none";
  finalScene.classList.add("show");
  
  startPaperRain();
  startFinalRain(); // Start endless hearts & flowers rain
  
  const lines = document.querySelectorAll('.message-line');
  
  lines.forEach((line, index) => {
    setTimeout(() => {
      line.classList.add('visible');
    }, index * 700 + 1800);
  });
  
  setInterval(() => {
    lines.forEach((line, index) => {
      setTimeout(() => {
        line.classList.remove('visible');
        setTimeout(() => {
          line.classList.add('visible');
        }, 50);
      }, index * 700);
    });
  }, 49000);
};

/* 🌸 ENDLESS FLOWER RAIN */
function startFlowerRain(){
  flowerInterval=setInterval(()=>{
    if(document.querySelectorAll('.flower').length>20) return;

    const f=document.createElement("div");
    f.className="flower";
    f.innerHTML=Math.random()>0.5?"🌸":"💐";
    f.style.left=Math.random()*100+"vw";
    f.style.animationDuration=(Math.random()*2+6)+"s";
    document.body.appendChild(f);

    setTimeout(()=>f.remove(),9000);
  },500);
}

/* 📄 OPTIMIZED PAPER RAIN */
function startPaperRain(){
  const papers = ['📄', '📋', '📃', '🗒️'];
  
  paperInterval=setInterval(()=>{
    if(document.querySelectorAll('.paper').length>8) return;

    const p=document.createElement("div");
    p.className="paper";
    p.innerHTML=papers[Math.floor(Math.random()*papers.length)];
    p.style.left=(Math.random()*90 + 5)+"vw";
    p.style.top="-50px";
    p.style.animationDuration=(Math.random()*2+8)+"s";
    document.body.appendChild(p);

    setTimeout(()=>p.remove(),11000);
  },1100);
}

/* ❤️ ENDLESS HEARTS & FLOWERS RAIN IN FINAL SCENE */
function startFinalRain(){
  setInterval(()=>{
    const totalElements = document.querySelectorAll('.heart-rain, .flower').length;
    if(totalElements > 30) return;

    // Randomly choose heart or flower
    const el=document.createElement("div");
    if(Math.random() > 0.5){
      el.className="heart-rain";
      el.innerHTML=["❤️", "💕", "💖", "💗"][Math.floor(Math.random()*4)];
    } else {
      el.className="flower";
      el.innerHTML=["🌸", "🌺", "🌹", "💐"][Math.floor(Math.random()*4)];
    }
    
    el.style.left=Math.random()*100+"vw";
    el.style.animationDuration=(Math.random()*3+7)+"s";
    document.body.appendChild(el);

    setTimeout(()=>el.remove(),11000);
  },400); // Continuous rain
}
</script>

</body>
</html>
