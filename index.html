<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Happy New Year ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#0b0b2e,#000);
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  color:white;
}

/* Start heart - ENHANCED */
#start{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:120px;
  cursor:pointer;
  animation:pulse 2.4s cubic-bezier(.4,0,.2,1) infinite;
  filter:drop-shadow(0 0 30px rgba(255,80,90,.8)) drop-shadow(0 0 60px rgba(255,80,90,.4));
  transition: all 0.3s ease;
}
#start:hover{
  transform:translate(-50%,-50%) scale(1.15);
  filter:drop-shadow(0 0 40px rgba(255,80,90,1)) drop-shadow(0 0 80px rgba(255,80,90,.6));
}
@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1);}
  50%{transform:translate(-50%,-50%) scale(1.25);}
  100%{transform:translate(-50%,-50%) scale(1);}
}

/* Click hint - ENHANCED */
#startHint{
  position:absolute;
  top:58%;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  font-weight:500;
  opacity:.9;
  animation:hintFloat 2.2s ease-in-out infinite;
  pointer-events:none;
  background:linear-gradient(135deg, rgba(255,77,77,.15), rgba(196,69,105,.15));
  padding:12px 28px;
  border-radius:50px;
  border:2px solid rgba(255,107,157,.3);
  box-shadow:0 0 25px rgba(255,107,157,.4);
}
@keyframes hintFloat{
  0%{transform:translate(-50%,0); opacity:.7;}
  50%{transform:translate(-50%,8px); opacity:1;}
  100%{transform:translate(-50%,0); opacity:.7;}
}

/* Tree - LEFT SIDE - MORE ROMANTIC */
#tree{
  position:absolute;
  bottom:-400px;
  left:2%;
  display:none;
  animation:riseTree 5s cubic-bezier(.34,.8,.34,1) forwards, sway 4s ease-in-out infinite 5.5s;
  filter:drop-shadow(0 10px 30px rgba(255,80,90,.3));
}
@keyframes riseTree{ 
  to{
    bottom:0;
    filter:drop-shadow(0 10px 40px rgba(255,80,90,.4));
  } 
}
@keyframes sway{
  0%, 100%{ 
    transform:rotate(0deg); 
  }
  25%{ 
    transform:rotate(-1.5deg); 
  }
  75%{ 
    transform:rotate(1.5deg); 
  }
}

/* Trunk - SMOOTHER & MORE ROMANTIC */
#trunk{
  width:32px;
  height:0;
  background:linear-gradient(to bottom, #8B4513 0%, #654321 50%, #4a2f1a 100%);
  margin:auto;
  border-radius:16px;
  box-shadow: 
    inset 0 0 18px rgba(0,0,0,.35),
    0 5px 20px rgba(139,69,19,.3);
  animation:growTrunk 4s cubic-bezier(.34,.8,.34,1) forwards;
  position:relative;
}
#trunk::after{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  width:50%;
  height:100%;
  background:linear-gradient(to right, rgba(255,255,255,.1), transparent);
  border-radius:16px 0 0 16px;
}
@keyframes growTrunk{ 
  0%{
    height:0;
    opacity:0;
  }
  50%{
    opacity:1;
  }
  100%{
    height:320px;
    opacity:1;
  } 
}

/* Heart area - MORE ROMANTIC */
#heartTree{
  width:550px;
  height:480px;
  position:relative;
  margin:0 auto 12px auto;
  animation:heartGlow 3s ease-in-out infinite 8s;
}

@keyframes heartGlow{
  0%, 100%{
    filter:drop-shadow(0 0 15px rgba(255,70,90,.3));
  }
  50%{
    filter:drop-shadow(0 0 30px rgba(255,70,90,.6));
  }
}

/* Heart leaves - MORE ROMANTIC & SMOOTH */
.leaf{
  position:absolute;
  opacity:0;
  transform:translateY(30px) scale(0.2) rotate(0deg);
  animation:bloom 3.2s cubic-bezier(.34,1.2,.64,1) forwards;
  filter:
    drop-shadow(0 0 12px rgba(255,70,90,.5))
    drop-shadow(0 0 25px rgba(255,70,90,.3));
}
@keyframes bloom{
  0%{
    opacity:0;
    transform:translateY(40px) scale(0.1) rotate(-30deg);
  }
  40%{
    opacity:0.7;
    transform:translateY(10px) scale(0.9) rotate(10deg);
  }
  60%{
    opacity:1;
    transform:translateY(-8px) scale(1.12) rotate(5deg);
  }
  75%{
    transform:translateY(-3px) scale(1.05) rotate(-2deg);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1) rotate(0deg);
  }
}

/* Text - SMOOTHER */
#text{
  position:absolute;
  top:16%;
  right:6%;
  width:42%;
  font-size:22px;
  line-height:1.8;
  opacity:0;
  transition:opacity 2s ease, transform 2s ease;
  transform:translateY(20px);
}
#text.visible{
  opacity:1;
  transform:translateY(0);
}
.name{
  font-family:'Great Vibes',cursive;
  font-size:56px;
  color:#ff4d4d;
  text-shadow:0 0 20px rgba(255,80,80,.9);
}

/* Button - MORE AESTHETIC */
#loveBtn{
  position:absolute;
  right:6%;
  top:72%;
  padding:18px 40px;
  border-radius:50px;
  border:2px solid transparent;
  background:linear-gradient(135deg, rgba(255,77,77,.25), rgba(196,69,105,.25));
  background-clip:padding-box;
  color:#ffb3d9;
  font-size:19px;
  font-weight:500;
  cursor:pointer;
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:all 0.4s cubic-bezier(.34,.8,.34,1);
  box-shadow:
    0 0 30px rgba(255,107,157,.5),
    inset 0 0 20px rgba(255,107,157,.15);
  position:relative;
  overflow:hidden;
}
#loveBtn::before{
  content:'';
  position:absolute;
  top:-2px;
  left:-2px;
  right:-2px;
  bottom:-2px;
  background:linear-gradient(135deg, #ff4d6d, #c44569, #ff6b9d);
  border-radius:50px;
  z-index:-1;
  opacity:0.6;
  animation:borderGlow 3s ease infinite;
}
@keyframes borderGlow{
  0%, 100%{ opacity:0.6; }
  50%{ opacity:1; }
}
#loveBtn.show{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
#loveBtn:hover{
  transform:translateY(-3px) scale(1.05);
  box-shadow:
    0 0 50px rgba(255,107,157,.8),
    0 10px 30px rgba(255,107,157,.4),
    inset 0 0 30px rgba(255,107,157,.25);
  color:#fff;
}

/* Final Button - MORE AESTHETIC */
#finalBtn{
  position:absolute;
  right:6%;
  top:82%;
  padding:18px 40px;
  border-radius:50px;
  border:2px solid transparent;
  background:linear-gradient(135deg, rgba(255,215,0,.25), rgba(255,185,0,.25));
  background-clip:padding-box;
  color:#ffd700;
  font-size:19px;
  font-weight:500;
  cursor:pointer;
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:all 0.4s cubic-bezier(.34,.8,.34,1);
  box-shadow:
    0 0 30px rgba(255,215,0,.5),
    inset 0 0 20px rgba(255,215,0,.15);
  position:relative;
  overflow:hidden;
}
#finalBtn::before{
  content:'';
  position:absolute;
  top:-2px;
  left:-2px;
  right:-2px;
  bottom:-2px;
  background:linear-gradient(135deg, #ffd700, #ffb900, #ffa500);
  border-radius:50px;
  z-index:-1;
  opacity:0.6;
  animation:borderGlow 3s ease infinite;
}
#finalBtn.show{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
#finalBtn:hover{
  transform:translateY(-3px) scale(1.05);
  box-shadow:
    0 0 50px rgba(255,215,0,.8),
    0 10px 30px rgba(255,215,0,.4),
    inset 0 0 30px rgba(255,215,0,.25);
  color:#fff;
}

/* Final Scene - ENHANCED AESTHETIC */
#finalScene{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
  opacity:0;
  transition:all 3s ease;
}
#finalScene.show{
  display:flex;
  opacity:1;
  background:radial-gradient(ellipse at center, rgba(10,10,40,0.98), rgba(0,0,0,0.99));
}

#finalContent{
  text-align:center;
  max-width:1000px;
  padding:60px 40px;
  position:relative;
  z-index:2;
}

#finalContent h1{
  font-family:'Great Vibes',cursive;
  font-size:78px;
  color:#ff4d4d;
  margin-bottom:60px;
  text-shadow:
    0 0 40px rgba(255,80,80,1),
    0 0 80px rgba(255,80,80,.6),
    0 0 120px rgba(255,80,80,.3);
  animation:titleGlow 4s ease-in-out infinite;
  opacity:0;
  transform:translateY(-50px);
}
#finalScene.show #finalContent h1{
  animation:titleGlow 4s ease-in-out infinite, titleDrop 2s cubic-bezier(.34,.8,.34,1) forwards;
}

@keyframes titleDrop{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes titleGlow{
  0%, 100%{ 
    text-shadow:
      0 0 40px rgba(255,80,80,1),
      0 0 80px rgba(255,80,80,.6),
      0 0 120px rgba(255,80,80,.3);
  }
  50%{ 
    text-shadow:
      0 0 50px rgba(255,80,80,1),
      0 0 100px rgba(255,80,80,.8),
      0 0 150px rgba(255,80,80,.5);
  }
}

#finalContent .message-line{
  font-size:32px;
  font-weight:400;
  line-height:2.4;
  margin:20px 0;
  opacity:0;
  transform:translateY(-80px);
  text-shadow:0 2px 15px rgba(255,255,255,.2);
  letter-spacing:0.5px;
}

.message-line.visible{
  animation:dropFromSky 2.5s cubic-bezier(.34,.8,.34,1) forwards;
}

@keyframes dropFromSky{
  0%{
    opacity:0;
    transform:translateY(-100px) scale(0.8);
  }
  60%{
    opacity:1;
    transform:translateY(5px) scale(1.05);
  }
  80%{
    transform:translateY(-2px) scale(1);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* Enhanced plane squadron animation - CONTINUOUS DROPPING */
.plane-squadron{
  position:fixed;
  font-size:50px;
  z-index:999;
  filter:drop-shadow(0 0 20px rgba(255,255,255,.8));
}

/* Each plane drops one line continuously */
.plane-1{
  animation:planeFlightLeader 6s cubic-bezier(.42,0,.58,1) infinite;
  animation-delay:0s;
}
.plane-2{
  animation:planeFlightLeader 6s cubic-bezier(.42,0,.58,1) infinite;
  animation-delay:7s;
}
.plane-3{
  animation:planeFlightLeader 6s cubic-bezier(.42,0,.58,1) infinite;
  animation-delay:14s;
}
.plane-4{
  animation:planeFlightLeader 6s cubic-bezier(.42,0,.58,1) infinite;
  animation-delay:21s;
}
.plane-5{
  animation:planeFlightLeader 6s cubic-bezier(.42,0,.58,1) infinite;
  animation-delay:28s;
}
.plane-6{
  animation:planeFlightLeader 6s cubic-bezier(.42,0,.58,1) infinite;
  animation-delay:35s;
}
.plane-7{
  animation:planeFlightLeader 6s cubic-bezier(.42,0,.58,1) infinite;
  animation-delay:42s;
}

@keyframes planeFlightLeader{
  0%{
    left:-100px;
    top:-50px;
    transform:rotate(-20deg) scale(0.6);
    opacity:0;
  }
  10%{
    opacity:1;
    left:8%;
    top:3%;
    transform:rotate(-12deg) scale(0.75);
  }
  25%{
    left:22%;
    top:8%;
    transform:rotate(-6deg) scale(0.85);
  }
  40%{
    left:38%;
    top:12%;
    transform:rotate(-2deg) scale(0.95);
  }
  55%{
    left:55%;
    top:16%;
    transform:rotate(2deg) scale(1);
  }
  70%{
    left:72%;
    top:20%;
    transform:rotate(6deg) scale(0.95);
  }
  85%{
    left:88%;
    top:24%;
    transform:rotate(12deg) scale(0.8);
    opacity:1;
  }
  100%{
    left:120%;
    top:28%;
    transform:rotate(20deg) scale(0.6);
    opacity:0;
  }
}

/* Background plane for ambiance - SLOWER */
#plane{
  position:fixed;
  font-size:60px;
  z-index:1;
  animation:flyAcrossEnhanced 25s cubic-bezier(.42,0,.58,1) infinite;
  filter:drop-shadow(0 0 20px rgba(255,255,255,.4));
  opacity:0.5;
}

@keyframes flyAcrossEnhanced{
  0%{
    left:-120px;
    top:70%;
    transform:rotate(-15deg) scale(0.6);
    opacity:0;
  }
  8%{
    opacity:0.5;
  }
  20%{
    left:18%;
    top:72%;
    transform:rotate(-8deg) scale(0.7);
  }
  40%{
    left:38%;
    top:74%;
    transform:rotate(-2deg) scale(0.75);
  }
  60%{
    left:58%;
    top:76%;
    transform:rotate(3deg) scale(0.8);
  }
  80%{
    left:78%;
    top:78%;
    transform:rotate(8deg) scale(0.75);
  }
  92%{
    opacity:0.5;
  }
  100%{
    left:115%;
    top:80%;
    transform:rotate(15deg) scale(0.6);
    opacity:0;
  }
}

/* Papers falling - SLOWER, MORE BEAUTIFUL */
.paper{
  position:fixed;
  font-size:28px;
  pointer-events:none;
  z-index:1;
  animation:paperFallSlow linear forwards;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.3));
}
@keyframes paperFallSlow{
  0%{
    transform:translateY(0) rotate(0deg) translateX(0);
    opacity:1;
  }
  25%{
    transform:translateY(25vh) rotate(180deg) translateX(-30px);
    opacity:0.9;
  }
  50%{
    transform:translateY(50vh) rotate(360deg) translateX(20px);
    opacity:0.8;
  }
  75%{
    transform:translateY(75vh) rotate(540deg) translateX(-15px);
    opacity:0.6;
  }
  100%{
    transform:translateY(110vh) rotate(720deg) translateX(0);
    opacity:0.2;
  }
}

/* Flowers */
.flower{
  position:fixed;
  top:-10vh;
  font-size:20px;
  pointer-events:none;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg); opacity:0;}
}

/* Mobile optimization */
@media (max-width:768px){
  #start{
    font-size:90px;
  }
  #startHint{
    font-size:16px;
    padding:10px 20px;
  }
  .leaf{ filter:none; }
  #heartTree{
    width:350px;
    height:310px;
  }
  #trunk{
    width:24px;
  }
  @keyframes growTrunk{ to{height:220px;} }
  #text{
    width:90%;
    right:5%;
    font-size:18px;
  }
  #loveBtn, #finalBtn{
    right:5%;
    font-size:16px;
    padding:14px 32px;
  }
  #finalContent{
    padding:20px;
  }
  #finalContent h1{
    font-size:42px;
  }
  #finalContent .message-line{
    font-size:20px;
  }
  #plane{
    font-size:50px;
  }
}
</style>
</head>

<body>

<div id="start">❤️</div>
<div id="startHint">Click the heart ❤️</div>

<div id="tree">
  <div id="heartTree"></div>
  <div id="trunk"></div>
</div>

<div id="text"></div>
<button id="loveBtn">Mon cœur bat pour toi ❤️</button>
<button id="finalBtn">Notre histoire, nos univers ✨</button>

<div id="finalScene">
  <div id="plane">✈️</div>
  <div id="finalContent">
    <h1>Happy New Year ✨</h1>
    <div class="message-line">As the year turns ✨</div>
    <div class="message-line">between my code 💻 and your wings ✈️</div>
    <div class="message-line">nos rêves yahdro m3a ba3d ❤️</div>
    <div class="message-line">and take off into a new beginning 🚀</div>
    <div class="message-line" style="margin-top:50px; font-size:38px; color:#ffd700;">Happy New Year</div>
    <div class="message-line" style="font-size:36px; color:#ff4d4d;">to us, Maroua ❤️</div>
    <div class="message-line" style="font-size:34px; color:#ffb3d9;">and dreams that never land ✨</div>
  </div>
  <!-- Squadron planes -->
  <div class="plane-squadron plane-1" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-2" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-3" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-4" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-5" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-6" style="left:-100px; top:-50px;">✈️</div>
  <div class="plane-squadron plane-7" style="left:-100px; top:-50px;">✈️</div>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/25/audio_946bdbb4c3.mp3">
</audio>

<script>
const start=document.getElementById("start");
const hint=document.getElementById("startHint");
const tree=document.getElementById("tree");
const heartTree=document.getElementById("heartTree");
const textBox=document.getElementById("text");
const loveBtn=document.getElementById("loveBtn");
const finalBtn=document.getElementById("finalBtn");
const finalScene=document.getElementById("finalScene");
const music=document.getElementById("music");

let typingStarted=false;
let flowerInterval;
let paperInterval;

/* HEART SHAPE - SMALLER (adjusted points) */
function buildHeartPoints(){
  const w=heartTree.clientWidth;
  const h=heartTree.clientHeight;
  const cx=w*0.5;
  const cy=h*0.55;
  const scale=Math.min(w,h)*0.032;

  const outline=[], fill=[];
  for(let i=0;i<200;i++){
    const t=(i/200)*Math.PI*2;
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    outline.push([cx+x*scale,cy-y*scale]);
  }
  for(let i=0;i<380;i++){
    const b=outline[Math.random()*outline.length|0];
    const pull=Math.pow(Math.random(),1.6);
    fill.push([
      b[0]+(cx-b[0])*pull+(Math.random()-0.5)*8,
      b[1]+(cy-b[1])*pull+(Math.random()-0.5)*8
    ]);
  }
  return fill.concat(outline).sort((a,b)=>b[1]-a[1]);
}

function spawnHeart(points){
  heartTree.innerHTML="";
  const base=3.2, step=0.028;
  points.forEach((p,i)=>{
    const l=document.createElement("div");
    l.className="leaf";
    l.innerHTML="❤️";
    l.style.left=p[0]+"px";
    l.style.top=p[1]+"px";
    l.style.fontSize=(14+Math.random()*11)+"px";
    l.style.animationDelay=(base+i*step)+"s";
    heartTree.appendChild(l);
  });
}

/* MESSAGE */
const message=`
Happy New Year ✨<br><br>
Une nouvelle année commence,<br>
and from our roots, love keeps growing,<br>
plus fort, plus haut, plus nous ❤️<br><br>

<span class="name">Maroua ❤️</span><br><br>

hamlghkam a dunithiw<br>
rabi ikhlina lba3dana ❤️<br>
kol 3am w hna kifkif ❤️<br><br>

Je t'aime today,<br>
je t'aime tomorrow,<br>
and for every year our love keeps rising ✨
`;

start.onclick=()=>{
  start.style.display="none";
  hint.style.display="none";
  tree.style.display="block";
  music.play();
  spawnHeart(buildHeartPoints());
  startFlowerRain();
  setTimeout(()=>loveBtn.classList.add("show"),10000);
};

loveBtn.onclick=()=>{
  if(typingStarted) return;
  typingStarted=true;

  loveBtn.style.display="none";
  textBox.classList.add("visible");

  let i=0;
  const t=setInterval(()=>{
    textBox.innerHTML=message.slice(0,i++);
    if(i>message.length){
      clearInterval(t);
      setTimeout(()=>finalBtn.classList.add("show"),2000);
    }
  },70);
};

finalBtn.onclick=()=>{
  finalBtn.style.display="none";
  finalScene.classList.add("show");
  
  // Start paper rain when final scene appears
  startPaperRain();
  
  // Animate text lines one by one - synchronized with continuous plane drops
  const lines = document.querySelectorAll('.message-line');
  
  // First cycle of lines (initial drop)
  lines.forEach((line, index) => {
    setTimeout(() => {
      line.classList.add('visible');
    }, index * 800 + 2000);
  });
  
  // Reset and repeat lines continuously with planes
  let cycleCount = 0;
  setInterval(() => {
    cycleCount++;
    lines.forEach((line, index) => {
      setTimeout(() => {
        // Remove visible class briefly
        line.classList.remove('visible');
        // Re-add it to trigger animation again
        setTimeout(() => {
          line.classList.add('visible');
        }, 50);
      }, index * 800);
    });
  }, 49000); // Repeat every 49 seconds (7 planes * 7 seconds)
};

/* 🌸 ENDLESS FLOWER RAIN */
function startFlowerRain(){
  flowerInterval=setInterval(()=>{
    if(document.querySelectorAll('.flower').length>25) return;

    const f=document.createElement("div");
    f.className="flower";
    f.innerHTML=Math.random()>0.5?"🌸":"💖";
    f.style.left=Math.random()*100+"vw";
    f.style.animationDuration=(Math.random()*3+6)+"s";
    document.body.appendChild(f);

    setTimeout(()=>f.remove(),9000);
  },450);
}

/* 📄 PAPER RAIN - SLOWER, MORE GRACEFUL */
function startPaperRain(){
  const papers = ['📄', '📋', '📃', '🗒️'];
  
  paperInterval=setInterval(()=>{
    if(document.querySelectorAll('.paper').length>15) return;

    const p=document.createElement("div");
    p.className="paper";
    p.innerHTML=papers[Math.floor(Math.random()*papers.length)];
    p.style.left=(Math.random()*90 + 5)+"vw"; // Keep papers more centered
    p.style.top="-50px";
    p.style.animationDuration=(Math.random()*4+10)+"s"; // Much slower: 10-14 seconds
    document.body.appendChild(p);

    setTimeout(()=>p.remove(),15000);
  },800); // Less frequent spawning for elegance
}
</script>
